name: Deploy to Databricks

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Databricks CLI
        uses: databricks/setup-cli@main

      - name: Upload arquivos para o workspace
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        continue-on-error: true
        run: databricks bundle deploy --target prod

      - name: Atualizar app existente
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          USER=$(databricks current-user me | python3 -c "import sys,json; print(json.load(sys.stdin)['userName'])")
          databricks apps deploy portal-dashs \
            --source-code-path "/Workspace/Users/${USER}/.bundle/portal_dash/prod/files"
